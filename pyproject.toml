[project]
name = "archforge-mcp"
version = "0.1.0"
description = "MCP server exposing a question bank (add/unattempted/record_attempt/domain_stats) so generation and review happen in the calling agent's own session, not via a separate billed API."
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archforge_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
